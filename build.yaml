# This file generates the GitHub Actions matrix.
# Add individual board + shield combinations to the `include` property. 
# You can also use the `cmake-args` property to pass flags to the build command, 
# `snippet` to add a Zephyr snippet, and `artifact-name` to assign a name to 
# distinguish build outputs from each other:

include:
  # Dongle — central device, with ZMK Studio enabled
  - board: halcyon_dongle//zmk
    shield: halcyon_kyria_dongle
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    snippet: studio-rpc-usb-uart
    artifact-name: kyria-dongle

  # Left half — wireless controller, coin cell, encoder module
  - board: halcyon_wireless//zmk
    shield: halcyon_kyria_left mod_battery_coincell mod_encoder_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: kyria-left

  # Right half — wireless controller, coin cell, encoder module
  - board: halcyon_wireless//zmk
    shield: halcyon_kyria_right mod_battery_coincell mod_encoder_right
    artifact-name: kyria-right
