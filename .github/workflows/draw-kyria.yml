name: Draw Kyria keymap

on:
  push:
    paths:
      - 'config/halcyon_kyria.keymap'
      - 'config/halcyon_kyria.json'
      - 'scripts/render_kyria.py'
      - '.github/workflows/draw-kyria.yml'
  pull_request:
    paths:
      - 'config/halcyon_kyria.keymap'
      - 'config/halcyon_kyria.json'
      - 'scripts/render_kyria.py'
      - '.github/workflows/draw-kyria.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install keymap-drawer
        run: python -m pip install keymap-drawer==0.23.0
      - name: Convert Kyria keymap to keymap-drawer data
        run: python scripts/render_kyria.py
      - name: Draw all five layers using keymap-drawer
        run: keymap draw -j diagrams/halcyon_kyria-layout.json diagrams/halcyon_kyria.yaml > diagrams/halcyon_kyria.svg
      - uses: actions/upload-artifact@v4
        with:
          name: kyria-keymap-diagram
          path: diagrams/
      - name: Commit generated diagram and source data
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagrams/halcyon_kyria-layout.json diagrams/halcyon_kyria.yaml diagrams/halcyon_kyria.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update Kyria keymap diagram'
            git push
          fi
