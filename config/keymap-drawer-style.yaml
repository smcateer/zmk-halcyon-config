# Match the keymap-drawer website's native dark-mode look.
# Colours and mono typography come from keymap-drawer's built-in stylesheet,
# rather than hardcoded custom overrides.
# This file controls only the drawing; it never changes ZMK firmware.

draw_config:
  dark_mode: true
  n_columns: 2

  # Match the website's default keycap geometry and spacing.
  key_w: 60
  key_h: 56
  key_rx: 6
  key_ry: 6
  inner_pad_w: 2
  inner_pad_h: 2
  outer_pad_w: 34
  outer_pad_h: 56
  draw_key_sides: false
  shrink_wide_legends: 7

  # The web app's dark page is #0e1117. Unlike the page, exported SVGs
  # need their own dark background to look right in standalone viewers.
  svg_extra_style: |
    svg.keymap { background-color: #0e1117; }
